# Dedicated TLS virtual host; only serves files.scardrone.cc.
server {
    listen 80;
    listen [::]:80;
    server_name files.scardrone.cc;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name files.scardrone.cc;

    ssl_certificate /etc/letsencrypt/live/files.scardrone.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.scardrone.cc/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SCAR_FILES_TLS:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2050m;
    client_body_timeout 1h;

    location /api/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 1h;
        proxy_read_timeout 1h;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        root /var/www/scardrone-files/client/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    }

    location ~ /.(?!well-known/) {
        deny all;
    }
}
